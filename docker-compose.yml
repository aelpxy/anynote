services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: anynote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: anynote
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anynote -d anynote"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://anynote:${POSTGRES_PASSWORD}@db:5432/anynote
      OPAQUE_SERVER_SETUP: ${OPAQUE_SERVER_SETUP}
    ports:
      - "${PORT:-8085}:8080"
    volumes:
      - attachments:/data/attachments
    restart: unless-stopped

volumes:
  pgdata:
  attachments:
